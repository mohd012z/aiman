name: Android migration validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android source
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
      - name: Build and test both variants
        run: |
          gradle --no-daemon :app:assembleStandardDebug :app:assembleAdvancedDebug :app:testStandardDebugUnitTest :app:testAdvancedDebugUnitTest :app:compileStandardDebugAndroidTestKotlin :app:compileAdvancedDebugAndroidTestKotlin
